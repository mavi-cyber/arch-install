# Example answers file for arch-install.sh
#
#   bash arch-install.sh --config answers.example.conf
#
# Every key is optional: anything missing (or invalid on this machine) is asked
# interactively. Passwords, the target disk and partitions are ALWAYS asked,
# so this file is safe to keep in a public repository and reuse on any PC.
# After an install, the answers you gave are saved to /root/arch-install.conf.

KEYMAP="us"
CONSOLE_FONT="default"          # default | ter-124b | ter-132b (HiDPI)

PART_MODE="auto"                # auto (erase disk) | manual (cfdisk / dual boot)
PART_TABLE="gpt"                # gpt | mbr (BIOS only)
ESP_SIZE="1024"                 # MiB
TRIM_DISK="yes"                 # SSD/NVMe: discard all blocks before partitioning
FILESYSTEM="ext4"               # ext4 | btrfs | xfs | f2fs
ENCRYPT="no"                    # yes = LUKS2 on the root partition
SWAP="zram"                     # zram | file | partition | none
SWAP_SIZE="8"                   # GiB, for file/partition

MIRRORS="reflector"             # keep | reflector (x86_64) | edit
MIRROR_COUNTRY="PK"

KERNEL="linux"                  # linux | linux-lts | linux-zen | linux-hardened
FIRMWARE="yes"
SOF_FIRMWARE="yes"
MICROCODE="intel-ucode"         # intel-ucode | amd-ucode | both | none
TEXT_EDITOR="nano"              # nano | vim | neovim | micro
NETWORK="networkmanager"        # networkmanager | networkd | none
DESKTOP="none"                  # none | gnome | kde | xfce
MULTILIB="no"
EXTRA_PACKAGES="git base-devel openssh"

TIMEZONE="Asia/Karachi"
LOCALES="en_US.UTF-8"
HOST_NAME="archlinux"
SET_ROOT_PW="yes"
USERNAME="me"

BOOTLOADER="systemd-boot"       # systemd-boot (UEFI) | grub | none
OS_PROBER="no"
REMOVABLE="no"
